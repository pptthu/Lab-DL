[project]
name = "lab-dl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dainguyenbao2006-cyber", email = "dainguyenbao2006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
lab-dl = "lab_dl:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
